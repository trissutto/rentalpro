name: Sincronizar calendarios iCal
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar sincronizacao do RentalPro
        run: curl -sS --fail -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://reservasita.com.br/api/cron/ical-sync
